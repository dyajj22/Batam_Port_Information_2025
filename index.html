<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batam Ports WebGIS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Batam Ports WebGIS</h1><p>Ship calls and passengers by terminal: annual totals with monthly breakdown &middot; <b>Data source: BP Batam, 2025</b></p></header>
<main>
 <div class="col">
  <section class="card">
   <div class="mapwrap"><div id="map"></div><div class="mode"><b>Information :</b><br><label><input type="radio" name="md" value="k" checked> Ships</label><br><label><input type="radio" name="md" value="p"> Passengers</label></div></div>
   <div class="legend">
    <span><i class="dot" style="background:var(--dom)"></i>Domestic / Indonesian-flagged</span>
    <span><i class="dot" style="background:var(--intl)"></i>International / Foreign-flagged</span>
    <span><i style="display:inline-block;width:22px;border-top:2px dashed #0b5cab;vertical-align:middle;margin-right:5px"></i>Shipping route</span>
    <span>Click a port to see ships sailing out and in along its routes</span>
   </div>
  </section>
  <section class="card" id="charts"></section>
 </div>
 <aside class="card">
  <h2 id="pn">Ports</h2>
  <div class="chips" id="chips"></div>
  <div id="detail"></div>
 </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
